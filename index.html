<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ELF</title><link rel="stylesheet" href="style.css"></head><body><main><section id="auth"><h1>ELF</h1><p>A place to share.</p><form id="signup"><input id="username" placeholder="Username" required><input id="email" type="email" placeholder="Email" required><input id="password" type="password" placeholder="Password" minlength="6" required><label><input id="agree" type="checkbox" required> I agree to the ELF Community Rules.</label><button>Create account</button></form><hr><form id="login"><input id="loginEmail" type="email" placeholder="Email" required><input id="loginPassword" type="password" placeholder="Password" required><button>Log in</button></form><small>ELF does not support illegal, sexual/inappropriate, threatening, abusive, or harmful content. Use the report tools and follow applicable laws.</small><p id="authMsg"></p></section><section id="app" hidden><nav><b>ELF</b><button data-tab="feed">For You</button><button data-tab="chat">Chat</button><button id="logout">Log out</button></nav><div id="feed"><h2>For You</h2><form id="postForm"><input id="caption" maxlength="500" placeholder="Say something..."><input id="media" type="file" accept="image/*,video/*" required><button>Upload</button></form><div id="posts"></div></div><div id="chat" hidden><h2>Chat</h2><p>Select a conversation from the list.</p><div id="conversations"></div><div id="messages"></div><form id="messageForm" hidden><input id="message" maxlength="4000" placeholder="Message..."><button>Send</button></form></div><div id="admin" hidden><h2>Admin</h2><p>Moderation tools</p></div></section></main><script type="module" src="app.js"></script></body></html>
